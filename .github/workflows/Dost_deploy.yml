# ● CI / CD 原理
#
# GitHub Repository
# │
# ├── features/AAA
# │    └── 開發功能分支
# │
# ├── main
# │    └── 主要分支：存放專案原始碼
# │
# └── gh-pages
#      └── 部署分支：存放 Build 完成後的網站檔案
#
#
#
# 流程（參照下半部的自動化部屬）：
#
# features/AAA
#   ↓
# Pull Request（PR）到 main
#   ↓
# GitHub Actions Workflow 觸發--檢查 check：安裝依賴、TypeScript 型別檢查
#   ↓
# check 成功
#   ↓
# 分支 features/AAA merge 合併到 main
#   ↓
# main 更新
#   ↓
# GitHub 產生 push event（事件通知）
#   ↓
# 觸發 GitHub Actions Workflow
#   ↓
# check
#   ↓
# build-deploy
#   ↓
# 將 dist/ 部署到 gh-pages
#   ↓
# GitHub Pages
#   ↓
# 將 gh-pages 的網站檔案提供給瀏覽器

#※ 補充
# CI ==> Continuous Integration — 持續整合
# CD ==> 有兩種：
#           Continuous Deployment — 持續部署
#           Continuous Delivery   — 持續交付（需要另外手動按「部署」）

# ┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬┬
# ┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴┴
# ● CI/CD 自動化流程（Pipeline）

# Action 名稱
name: Dost Deploy

# 觸發時機
on:
  # 當推送到遠端倉庫分支 main 時觸發。
  # 遠端 main 更新 → GitHub 產生 push event（事件通知） → GitHub Actions 收到事件 → 觸發 CI/CD。
  # 結論：當遠端倉庫分支 main 有更新時（不管任何方式觸發更新），都會觸發後續的 CI/CD 流程。
  push:
    branches: [main]

  # PR 的目標分支（base branch）是 main 時觸發。
  pull_request:
    branches: [main]

# 執行的工作
jobs:
  # 工作名稱：檢查
  check:
    # 執行工作的虛擬機作業系統
    runs-on: ubuntu-latest
    # 工作步驟
    steps:
      # 步驟 1：複製程式碼，讓 Runner（虛擬機作業系統）取得本次 Workflow 對應的程式碼以及 Git 資訊。
      - name: checkout
        # 使用的 actions/checkout 複製程式碼
        uses: actions/checkout@v4

      # 步驟 2：在虛擬機作業系統建置開發環境
      - name: Install
        run: npm install

      # 步驟 3：檢查 TS
      - name: Check TypeScript
        run: npm run type-check

  # 工作名稱：建立網站資料（打包）& 部署
  build-deploy:
    # 只有 push event 且目標分支為 main 或是 main 有更新時，才執行 Build & Deploy。
    # PR 事件即使觸發 Workflow，也不會執行這個工作。
    # 避免 PR 尚未 merge 到 main 就部署。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: check
    runs-on: ubuntu-latest
    steps:
      # 步驟 1：因使用新的 Runner，因此需要重新 checkout。
      # 主要讓 Runner 取得 Git repository 及 .git 資訊，供後續部署 Action 執行 Git 操作。
      - name: checkout
        uses: actions/checkout@v4

      # 步驟 2：在虛擬機作業系統建置開發環境
      - name: Install
        run: npm install

      # 步驟 3：打包輸出成網站檔案
      - name: Build
        run: npm run build
        env:
          VITE_API: ${{ secrets.VITE_API }}
          # 以下用來在網頁 <footer> 顯示更新得版本號和日期
          VITE_GIT_COMMIT: ${{ github.sha }}
          VITE_BUILD_DATE: ${{ github.event.head_commit.timestamp }}

      # 步驟 4：建立 .nojekyll（GitHub Pages 部署環境的特殊處理）
      # 避免 GitHub Pages 使用 Jekyll 處理檔案時，忽略 _ 開頭的檔案，而導致轉跳至網頁 4040
      # 例如：[id].vue 的檔案，[id] 是動態路由的命名方式，Vite 編譯時把 [ ] 轉成 _，所以一定會產生 _ 開頭的檔案。
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # 步驟 5：將已經 Build 完成的檔案部屬到分支
      - name: Deploy to Other Branch
        uses: JamesIves/github-pages-deploy-action@v4.6.5
        with:
          branch: gh-pages
          folder: dist
          # clean 在每次部署前，先把 gh-pages 分支「舊的檔案全部刪掉」，再上傳新的 dist，防止「舊 build 檔案殘留」導致 JS chunk 404 / dynamic import error
          clean: true
